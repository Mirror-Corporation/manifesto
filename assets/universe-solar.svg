<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Mirror Universe — solar system of six products">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0E1C16"/>
      <stop offset="55%" stop-color="#07120D"/>
      <stop offset="100%" stop-color="#040A07"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8B976" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D8B976" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D8B976" stop-opacity="0"/>
    </radialGradient>
    <filter id="planetGlow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Space background -->
  <rect width="1280" height="720" fill="url(#space)"/>

  <!-- Subtle stars -->
  <g fill="#E8F2EA">
    <circle cx="120" cy="80" r="0.8" opacity="0.6"/>
    <circle cx="240" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="1130" cy="100" r="0.8" opacity="0.6"/>
    <circle cx="1180" cy="240" r="1" opacity="0.5"/>
    <circle cx="80" cy="500" r="1" opacity="0.6"/>
    <circle cx="1200" cy="580" r="0.8" opacity="0.5"/>
    <circle cx="320" cy="640" r="1.1" opacity="0.5"/>
    <circle cx="980" cy="660" r="0.8" opacity="0.5"/>
    <circle cx="540" cy="60" r="0.8" opacity="0.6"/>
    <circle cx="720" cy="40" r="1" opacity="0.5"/>
    <circle cx="220" cy="700" r="0.7" opacity="0.5"/>
    <circle cx="1080" cy="700" r="1" opacity="0.4"/>
  </g>

  <!-- Orbital rings — concentric, Bond-style -->
  <g fill="none" stroke="#3FBC8C" opacity="0.18">
    <ellipse cx="640" cy="360" rx="160" ry="100" stroke-width="0.8"/>
    <ellipse cx="640" cy="360" rx="240" ry="150" stroke-width="0.6"/>
    <ellipse cx="640" cy="360" rx="320" ry="200" stroke-width="0.5"/>
    <ellipse cx="640" cy="360" rx="400" ry="250" stroke-width="0.4"/>
    <ellipse cx="640" cy="360" rx="480" ry="300" stroke-width="0.3"/>
    <ellipse cx="640" cy="360" rx="560" ry="340" stroke-width="0.25"/>
  </g>

  <!-- CORE — MIRROR (центр, золотой, светящийся) -->
  <circle cx="640" cy="360" r="80" fill="url(#coreGlow)" filter="url(#planetGlow)"/>
  <circle cx="640" cy="360" r="44" fill="#D8B976" opacity="0.95"/>
  <circle cx="640" cy="360" r="44" fill="none" stroke="#E8F2EA" stroke-width="1" opacity="0.4"/>
  <text x="640" y="357" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#07120D" letter-spacing="5" font-weight="500">MIRROR</text>
  <text x="640" y="375" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="9" fill="#07120D" letter-spacing="2" opacity="0.75">CORE · live</text>

  <!-- Orbit positions (6 products) -->
  <!-- Mirror Music (closest, in progress, emerald accent) -->
  <g transform="translate(800 260)">
    <circle r="32" fill="#3FBC8C"/>
    <circle r="32" fill="none" stroke="#E8F2EA" stroke-width="1" opacity="0.35"/>
    <text y="3" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#07120D" font-weight="500">Music</text>
    <text y="18" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="8" fill="#07120D" letter-spacing="1.5" opacity="0.75">in progress</text>
  </g>

  <!-- Mirror School -->
  <g transform="translate(440 220)">
    <circle r="28" fill="#0E1C16" stroke="#3FBC8C" stroke-width="1.5"/>
    <text y="2" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#E8F2EA" font-weight="500">School</text>
    <text y="16" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="7" fill="#7B9485" letter-spacing="1">planned</text>
  </g>

  <!-- Mirror Dating -->
  <g transform="translate(880 460)">
    <circle r="28" fill="#0E1C16" stroke="#3FBC8C" stroke-width="1.5"/>
    <text y="2" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#E8F2EA" font-weight="500">Dating</text>
    <text y="16" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="7" fill="#7B9485" letter-spacing="1">planned</text>
  </g>

  <!-- Mirror Memory (CORE Mirror — special!) -->
  <g transform="translate(280 460)">
    <circle r="32" fill="#0E1C16" stroke="#D8B976" stroke-width="1.8"/>
    <text y="-2" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#D8B976" font-weight="500">Memory</text>
    <text y="14" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="7" fill="#D8B976" letter-spacing="1">core idea · planned</text>
  </g>

  <!-- Mirror Companion -->
  <g transform="translate(1040 360)">
    <circle r="26" fill="#0E1C16" stroke="#3FBC8C" stroke-width="1.2" opacity="0.85"/>
    <text y="2" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#E8F2EA" font-weight="500">Companion</text>
    <text y="16" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="7" fill="#7B9485" letter-spacing="1">planned</text>
  </g>

  <!-- Mirror Тропа (Path) -->
  <g transform="translate(200 280)">
    <circle r="22" fill="#0E1C16" stroke="#7B9485" stroke-width="1" opacity="0.7"/>
    <text y="2" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#7B9485" font-weight="500">Path</text>
    <text y="14" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="6" fill="#7B9485" letter-spacing="1">later</text>
  </g>

  <!-- Sphere 2036 — special "phone to the future" -->
  <g transform="translate(640 70)" opacity="0.85">
    <circle r="22" fill="#0E1C16" stroke="#D8B976" stroke-width="1" stroke-dasharray="3 2"/>
    <text y="2" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#D8B976">Sphere 2036</text>
    <text y="14" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="6" fill="#D8B976" letter-spacing="1">phone to future</text>
  </g>
  <!-- Path line from Sphere to Core -->
  <line x1="640" y1="92" x2="640" y2="316" stroke="#D8B976" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Header text -->
  <text x="640" y="640" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#E8F2EA" opacity="0.92">the mirror universe</text>
  <text x="640" y="672" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" letter-spacing="1.5" fill="#3FBC8C">one core · six products · one thread</text>

  <!-- Bottom caption -->
  <text x="640" y="700" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif" font-size="10" letter-spacing="3" fill="#7B9485">voice as the carrier of presence</text>
</svg>
